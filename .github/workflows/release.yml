name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag must point to a commit on main."
            exit 1
          fi

      - name: Validate semver
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag is not valid semver: $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run checks
        run: make check

      - name: Extract changelog section to file
        # The notes file must live outside the checkout: GoReleaser's release
        # mode fails on a dirty git state, and an in-tree release-notes.md is
        # exactly that. (Snapshot rehearsals skip the dirty check, which is
        # why this only ever fails in the real workflow.)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="${{ runner.temp }}/release-notes.md"
          sed -n "/^## \[${VERSION}\]/,/^## \[/{/^## \[${VERSION}\]/d;/^## \[/d;p;}" CHANGELOG.md > "$NOTES_FILE"
          if [ -z "$(tr -d '[:space:]' < "$NOTES_FILE")" ]; then
            echo "::error::No changelog entry found for version ${VERSION}."
            echo "Add a '## [${VERSION}]' section to CHANGELOG.md before tagging."
            exit 1
          fi

      - name: Build and publish with GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go tool goreleaser release --clean --release-notes="${{ runner.temp }}/release-notes.md"

version: "2"

linters:
  enable:
    - errorlint    # mishandling wrapped errors (errors.Is/As, %w)
    - exhaustive   # missing cases in switch over enum-like types (session.State, hearts.Phase)
    - goconst      # repeated string/number literals that should be constants
    - godoclint    # godoc structure; catches duplicate package docs that convention_test.go cannot
    - godot        # doc comments end with a period
    - gosec        # security static analysis
    - lll          # line length
    - misspell     # common English misspellings
    - nakedret     # no naked returns, ever; named results are documentation, not a license for bare return
    - nilerr       # returning nil after seeing a non-nil error
    - nolintlint   # police any //nolint usage
    - prealloc     # slices that should be preallocated
    - thelper      # test helpers must call t.Helper()
    - unparam      # unused function parameters / always-same return values
    - whitespace   # leading/trailing whitespace inside funcs

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      ignore-tests: true
    lll:
      line-length: 100
      tab-width: 4
    nakedret:
      max-func-lines: 0  # forbid naked returns in every function, however short

  exclusions:
    generated: lax
    rules:
      - path: (_test\.go$|/testutil/)
        linters:
          - gosec    # tests and test-support fixtures intentionally use deterministic RNG, subprocesses, and variable paths/URLs
      - path: internal/server/(session|view)/games/hearts
        text: "G115:"
        linters:
          - gosec    # seat indices are bounded by hearts.NumPlayers by construction; G115 cannot see the range proof
      - path: internal/server/session/manager\.go
        text: "G404:"
        linters:
          - gosec    # newRNG is seeded from crypto/rand; the time-based fallback only fires if crypto/rand fails
      - path: cmd/cardcore-cli/main\.go
        text: "G703:"
        linters:
          - gosec    # reading the user-specified -script path is the tool's documented purpose
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gci          # import grouping (stdlib / third-party / local)
    - gofmt        # standard Go formatting

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/jrgoldfinemiddleton/cardcore-server)
    gofmt:
      simplify: true

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
